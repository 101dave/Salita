<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="theme-color" content="#f7f9f8" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Salita" />
<meta property="og:title" content="Salita — A world of understanding" />
<meta property="og:description" content="Translate, save, and learn. A static Salita workspace for Filipino, Philippine regional languages, and meaningful connections around the world." />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
<style>:root{--bg:#f7f9f8;--white:#fff;--text:#24372d;--muted:#89928d;--secondary:#727e76;--border:#e5eae6;--green:#72dfaa;--green-dark:#276246;--green-light:#eaf6ee;--sidebar:232px;--radius:12px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans","Segoe UI",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:default;opacity:.57}
button:focus-visible,a:focus-visible{outline:2px solid #41b87d;outline-offset:4px}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
button,input,select,textarea{transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease}
img{max-width:100%;display:block}
svg{flex-shrink:0}
::selection{background:#c4efd6;color:#163f2b}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 3px #24372d02}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:7px;min-height:39px;padding:9px 15px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.3}
.button.primary{background:var(--green);border-color:var(--green);color:#194530}
.button.primary:hover:not(:disabled){background:#5cd69b;border-color:#5cd69b;box-shadow:0 2px 4px #2762460c}
.button.secondary{background:#fff;border-color:#e1e7e2;color:#53655a}
.button.secondary:hover:not(:disabled){background:#f5faf7;border-color:#c3d2c7}
.button.danger{background:#d95353;color:#fff;border-color:#d95353}
.button.danger:hover:not(:disabled){background:#c54545}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;flex-shrink:0;color:#8a958d}
.icon-button:hover:not(:disabled){background:#edf4ef;color:#355b45}
.icon-button.is-saved{color:#4a9b6e}
.icon-button.is-saved:hover{background:#def2e5}
.text-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:600;color:#547761;white-space:nowrap;padding:5px 0}
.text-button:hover{color:#21935a}
.spinner{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tiny-dot{display:inline-block;flex-shrink:0;width:5px;height:5px;border-radius:50%;background:#69c78e}
.green-period{color:#65c88c}
.eyebrow{display:block;font-size:9px;letter-spacing:1.25px;font-weight:700;color:#7d9585;line-height:1.6}
.mint{background:#eaf6ee;color:#65a982}
.blue{background:#edf3fa;color:#7f9dbd}
.purple{background:#f2eef8;color:#a08ab8}
.peach{background:#fff2e7;color:#d79b65}
.section-icon{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.soft-badge{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #dfe9e1;background:#f0f7f2;border-radius:6px;font-size:10px;color:#6b8a75;white-space:nowrap}

/* The workspace shell */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);z-index:45;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e6ede8 transparent}
.sidebar-brand{padding:30px 27px 33px;position:relative}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:35px;letter-spacing:-1.8px;font-weight:700;line-height:1}
.brand-mark{color:#89e2ac;width:34px;height:34px;display:inline-flex;transform:translateY(-1px)}
.brand-mark svg{width:100%;height:100%}
.brand-dot{color:#70d29a}
.brand-tagline{display:block;font-size:10px;color:#9ba49d;margin-top:11px;letter-spacing:.1px}
.brand-button{padding:0;display:block}
.brand-small{font-size:28px;gap:6px;letter-spacing:-1.4px}
.brand-small .brand-mark{width:27px;height:27px}
.nav-group-label{font-size:9px;letter-spacing:1.35px;font-weight:600;color:#a1aaa3;padding:0 27px;margin-bottom:12px}
.nav-group{padding:0 14px;display:flex;flex-direction:column;gap:5px}
.nav-item{display:flex;align-items:center;gap:11px;border-radius:7px;padding:11px 13px;width:100%;min-height:43px;font-size:12.5px;color:#7b877f;text-align:left;position:relative;white-space:nowrap}
.nav-item>span:not(.nav-badge):not(.nav-active-dot){flex:1}
.nav-item>svg:last-child:not(:first-child){opacity:.6}
.nav-item:hover{background:#f6f9f6;color:#467256}
.nav-item.active{color:#39835a;background:#eaf5ed;font-weight:600}
.nav-item.active>svg{color:#459766}
.nav-badge{font-size:9px;font-weight:600;color:#8b978e;background:#f0f3f0;padding:2px 6px;border-radius:4px;line-height:1.6}
.nav-item.active .nav-badge{color:#43835b;background:#d9eddf}
.nav-active-dot{width:5px;height:5px;border-radius:50%;background:#65b481;margin-left:auto}
.nav-item:has(.nav-badge) .nav-active-dot{display:none}
.library-label{margin-top:29px}
.sidebar-bottom{margin-top:auto;padding:28px 15px 0}
.sidebar-inspiration{padding:17px 16px 15px;background:#f1f7ed;border:1px solid #e7efdf;border-radius:9px;position:relative;overflow:hidden}
.inspiration-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:#e2edda;color:#709566;border-radius:8px;margin-bottom:11px}
.inspiration-decor{position:absolute;top:21px;right:-1px;font-size:71px;line-height:1;color:#dee9d6;transform:rotate(8deg);font-weight:400}
.sidebar-inspiration h3{font-size:14px;letter-spacing:-.25px;line-height:1.5;font-weight:600;position:relative}
.sidebar-inspiration p{font-size:10.5px;color:#94a08b;line-height:1.65;margin-top:7px}
.sidebar-inspiration button{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:10px;font-weight:600;color:#6f8b62;margin-top:15px;padding-top:12px;border-top:1px solid #e2eadc}
.sidebar-inspiration button:hover{color:#327b44}
.sidebar-utilities{margin-top:20px;display:flex;flex-direction:column;gap:3px}
.sidebar-utilities .nav-item{padding-left:12px;font-size:11.5px;min-height:40px}
.sidebar-user{border-top:1px solid var(--border);padding:20px 4px;display:flex;align-items:center;text-align:left;gap:10px;width:100%;margin-top:13px}
.avatar{width:34px;height:34px;background:#efe9e0;color:#927c60;border:3px solid #f9f7f3;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:600;flex-shrink:0;letter-spacing:.1px}
.sidebar-user-text{display:flex;flex:1;min-width:0;flex-direction:column;gap:5px}
.sidebar-user-text strong{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user-text>span{display:flex;align-items:center;gap:5px;font-size:9px;color:#9ca59e}
.sidebar-user>svg{color:#a7afa9}
.main-shell{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:73px;border-bottom:1px solid var(--border);background:#ffffffed;backdrop-filter:blur(12px);padding:0 35px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:30}
.breadcrumbs{display:flex;align-items:center;gap:13px;font-size:11px;color:#a2aaa5;white-space:nowrap;min-width:0}
.breadcrumbs .breadcrumb-icon{color:#91a094;margin-right:6px}
.breadcrumbs button{color:#9ba59e;padding:3px 0;font-size:11px}
.breadcrumbs button:hover{color:#4c825f}
.breadcrumbs>span{color:#536c5c;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:18px;flex-shrink:0}
.sign-in-link{display:flex;align-items:center;gap:5px;font-size:10px;color:#769880;white-space:nowrap;padding:6px 0}
.sign-in-link:hover{color:#38875b}
@media(max-width:730px){.sign-in-link{display:none}}
.global-search-trigger{display:flex;align-items:center;gap:9px;color:#9aa69e;font-size:10.5px;background:#fafcfb;border:1px solid #e9ede9;border-radius:7px;padding:9px 10px;min-width:213px;height:34px;text-align:left}
.global-search-trigger span{flex:1}
.global-search-trigger kbd{font:9px "DM Sans",sans-serif;border:1px solid #e3e9e4;border-radius:3px;padding:2px 4px;background:white;color:#9aa59d;letter-spacing:.5px}
.global-search-trigger:hover{background:#f1f7f3;border-color:#dce7df}
.notification-trigger{position:relative;color:#85938a}
.notification-dot{position:absolute;right:5px;top:4px;width:4px;height:4px;border:1.5px solid white;box-sizing:content-box;background:#80c99b;border-radius:50%}
.topbar-divider{width:1px;height:24px;background:#e9ede9;margin-left:-4px}
.profile-control{position:relative}
.profile-trigger{display:flex;align-items:center;gap:8px;color:#8b9b90;padding:0}
.top-avatar{width:32px;height:32px;font-size:9px}
.profile-menu-backdrop{position:fixed;inset:0;z-index:31;cursor:default}
.profile-menu{position:absolute;right:0;top:46px;width:245px;padding:16px;background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px #1a38221a;z-index:32;display:flex;flex-direction:column;animation:modal-in .15s ease}
.profile-menu>strong{font-size:13px}
.profile-menu>span{font-size:10px;color:#96a198;margin-top:5px}
.profile-menu hr{border:0;border-top:1px solid var(--border);margin:13px 0 7px}
.profile-menu>button{display:flex;align-items:center;gap:10px;padding:11px 6px;border-radius:5px;font-size:11px;color:#6a7e70;text-align:left}
.profile-menu>button:hover{background:#f1f7f3}
.main-content{max-width:1560px;margin:0 auto;padding:31px 35px 20px}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px;min-height:60px}
.page-heading h1{font-size:29px;letter-spacing:-1.15px;line-height:1.25;font-weight:600;color:#253b2e}
.page-heading p{font-size:11.5px;color:#8b988e;line-height:1.7;margin-top:9px;letter-spacing:.01px}
.page-heading .eyebrow{margin-bottom:8px}
.greeting-line{display:flex;align-items:center;gap:13px}
.greeting-line>svg{color:#dcb65f;transform:rotate(-9deg)}
.daily-goal{display:flex;align-items:center;gap:11px;text-align:left;padding:4px 0;color:#a0aaa2;flex-shrink:0}
.goal-ring{width:31px;height:31px;border:3px solid #e3eee6;border-right-color:#87cda1;border-bottom-color:#87cda1;transform:rotate(-32deg);border-radius:50%;display:flex;align-items:center;justify-content:center}
.goal-ring>span{width:7px;height:7px;border-radius:50%;background:#b9d8c3}
.daily-goal>span:last-child{font-size:9px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.daily-goal strong{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:500;color:#698473}
.daily-goal:hover strong{color:#2f8d55}
.workspace-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:25px 0 3px;font-size:9px;color:#a5aea7;letter-spacing:.02px}
.workspace-footer>span:last-child{display:flex;align-items:center;gap:5px}
.workspace-footer .tiny-dot{width:4px;height:4px;margin-right:3px;background:#a2c6ad}
.workspace-footer em{font-style:normal;color:#8d9c92}
.footer-flag{font-size:10px;margin-left:3px;opacity:.65}
.mobile-close,.mobile-menu{display:none}

/* Overview */
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:23px}
.stat-card{padding:15px 17px 14px;position:relative;min-height:111px}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:#849087}
.stat-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.stat-value{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.7px;margin-top:-1px}
.stat-value>span{font-size:13px;font-weight:400;letter-spacing:0;color:#8c988f;margin-left:6px}
.stat-note{font-size:9px;color:#a4ada6;margin-top:9px;display:flex;align-items:center;gap:5px;line-height:1.3;white-space:nowrap}
.stat-note.positive{color:#74a686}
.dashboard-feature-grid,.dashboard-bottom-grid{display:grid;grid-template-columns:minmax(0,2.12fr) minmax(0,1fr);gap:22px;align-items:stretch}
.dashboard-feature-grid{margin-bottom:26px}
.dashboard-bottom-grid{align-items:start}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;min-height:37px}
.section-heading h2{font-size:16px;letter-spacing:-.35px;font-weight:600;line-height:1.4}
.section-heading p{font-size:10px;line-height:1.5;color:#9aa59d;margin-top:4px}
.dashboard-courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.daily-word-card{padding:19px 21px 17px;border:1px solid #dfe9d8;background:#f0f5e9;border-radius:var(--radius);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:323px}
.daily-word-card>*:not(.daily-flower){position:relative;z-index:1}
.daily-flower{position:absolute;top:57px;right:14px;color:#b5c9a5;opacity:.65;transform:rotate(6deg)}
.daily-word-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:6px;color:#809474}
.daily-word-heading>span:first-child{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600}
.daily-word-date{font-size:8px;color:#a1af93}
.word-language{font-size:8px;letter-spacing:1.3px;color:#92a083;font-weight:600}
.word-language>span{padding:0 3px}
.daily-word-title{display:flex;align-items:center;gap:13px;margin-top:4px}
.daily-word-title h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:38px;letter-spacing:-1.5px;line-height:1.2;color:#3b5235}
.daily-word-title .icon-button{width:26px;height:26px;background:#e6eddf;border-radius:50%;color:#889d79;margin-top:5px}
.daily-word-title .icon-button:hover{background:#dbe7cf}
.daily-phonetic{font-size:9px;color:#9ca68e;letter-spacing:.4px;margin-top:3px}
.daily-definition{font-size:13px;line-height:1.65;color:#7a8c6e;margin:13px 0 12px}
.daily-definition strong{font-weight:500;color:#506747}
.daily-example{border-left:2px solid #d1dfc5;padding-left:10px;color:#8d9b7f;font-size:9px;line-height:1.7}
.daily-example>span{font-style:italic}
.daily-example p{font-size:8.5px;color:#a4ad98;margin-top:2px}
.daily-save{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:17px;font-size:10px;font-weight:500;color:#748b64;text-align:left}
.daily-save:hover:not(:disabled){color:#39783f}
.daily-save:disabled{opacity:.85}
.plus-mark{margin-left:auto;display:flex;align-items:center;justify-content:center;width:19px;height:19px;font-size:18px;font-weight:400;background:#e4ecd9;border:1px solid #dae5ce;border-radius:4px;line-height:1}
.recent-phrases-card{overflow:hidden}
.recent-phrase{display:flex;align-items:center;gap:10px;padding:16px 15px;border-bottom:1px solid #eff2ef;min-height:67px}
.recent-flag{width:30px;height:30px;background:#f8faf8;border:1px solid #edf0ec;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;flex-shrink:0}
.recent-phrase-text{flex:1;text-align:left;min-width:0;padding:0;display:flex;flex-direction:column;gap:5px}
.recent-phrase-text>span{font-size:9px;color:#97a198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-phrase-text strong{font-size:11.5px;font-weight:500;color:#58715c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-phrase-text:hover strong{color:#30985c}
.recent-phrase .icon-button{width:22px;color:#a3b09f}
.phrasebook-card-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:13px 15px;background:#fcfdfb;font-size:8px;color:#a0ac98;min-height:41px}
.phrasebook-card-footer>span{display:flex;align-items:center;gap:7px}
.phrasebook-card-footer:hover{background:#f3f8ef;color:#6a8c5d}
.recent-empty{padding:30px 18px;text-align:center;color:#9aae99;min-height:201px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:11px}
.recent-empty p{font-size:11px}
.discovery-strip{margin-top:25px;border-top:1px solid #e3e9e3;padding:20px 0 0;display:flex;align-items:center;gap:13px}
.discovery-globe{width:39px;height:39px;flex-shrink:0;border-radius:50%;background:#eef5ee;display:flex;align-items:center;justify-content:center;color:#93b397}
.discovery-strip>div{flex:1}
.discovery-strip strong{font-size:11px;font-weight:500;color:#7f9585}
.discovery-strip p{font-size:9px;color:#a1aca3;margin-top:5px}
.discovery-strip>.text-button{font-size:9px;color:#85a28c}

/* Translator */
.translator-card{display:flex;flex-direction:column;min-height:323px;overflow:hidden}
.translator-heading{padding:17px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.translator-heading h2{font-size:13px;display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.2px}
.translator-heading h2 svg{color:#73977e}
.translator-tabs{display:flex;align-items:center;border:1px solid #e9ede9;background:#f9fbf9;padding:3px;border-radius:6px;gap:2px}
.translator-tabs button{display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;font-size:9px;border-radius:4px;color:#9ba59d;line-height:1.2}
.translator-tabs button.active{color:#62836b;background:white;box-shadow:0 1px 3px #1a3b2210;border:1px solid #e6ece6;padding:3px 7px}
.translator-tabs button:hover{color:#4c815d}
.translator-languages{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);border-top:1px solid #edf0ec;border-bottom:1px solid #e8ede7;align-items:center;background:#fcfdfc;gap:0;padding:6px 10px}
.language-select{height:30px;width:100%;border:0;outline:0;background:transparent;color:#64776a;font-size:11px;font-weight:500;cursor:pointer;padding:4px 8px;border-radius:4px;min-width:0}
.language-select:hover{background:#f1f6f2}
.language-select:focus-visible{outline:2px solid #89c99f;outline-offset:-1px}
.translator-languages>.language-select:last-child{margin-left:10px;width:calc(100% - 10px)}
.translator-languages .icon-button{width:26px;height:26px;border:1px solid #e5ebe4;background:white;color:#91a38f;border-radius:50%;justify-self:center}
.swap-icon{transform:rotate(90deg)}
.translation-panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;min-height:150px}
.translation-source,.translation-output{position:relative;padding:18px 18px 41px;min-width:0}
.translation-source{border-right:1px solid #e9eee8;display:flex;flex-direction:column}
.translation-output{background:#f7faf6}
.translation-source textarea{display:block;width:100%;height:79px;resize:none;border:0;padding:0 16px 0 0;background:none;outline:0;font-size:17px;line-height:1.6;color:#637267;letter-spacing:-.35px;scrollbar-width:thin}
.translation-source textarea::placeholder{color:#bdc6bc;font-size:14px;letter-spacing:-.2px}
.clear-text{position:absolute;top:17px;right:9px;width:21px;height:23px;color:#b2bbb2;opacity:.6}
.clear-text:hover{opacity:1}
.translated-text{font-size:17px;line-height:1.6;color:#537957;letter-spacing:-.35px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:90px;overflow:auto;scrollbar-width:thin}
.translated-text.placeholder{font-size:14px;color:#b4c0b1;letter-spacing:-.2px}
.pronunciation{font-size:8px;letter-spacing:.15px;color:#a0b098;margin-top:8px;line-height:1.5}
.translation-note{font-size:9px;line-height:1.55;color:#8b9c84;margin-top:10px;max-width:34em}
.translation-output:has(.translation-note) .translated-text{max-height:76px}
.translator-expanded .translation-note{font-size:10px;max-width:42em}
.translator-expanded .translation-output:has(.translation-note) .translated-text{max-height:135px}
.panel-tools{position:absolute;left:14px;right:15px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:25px}
.panel-tools>div{display:flex;align-items:center;gap:2px}
.panel-tools>.output-language{font-size:8px;color:#9bac93;display:flex;align-items:center;gap:5px}
.panel-tools>.output-language .tiny-dot{width:4px;height:4px;background:#a0bc92}
.panel-tools .icon-button{width:25px;height:25px;color:#9aac9b}
.panel-tools .icon-button:hover{color:#4b865c}
.panel-tools>span:not(.output-language){font-size:9px;color:#9ca79d}
.panel-tools>span>span:not(.tiny-dot){color:#bbc3ba}
.panel-tools .text-error{color:#ca6863!important}
.translator-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 13px;border-top:1px solid #e9eee7;min-height:62px}
.translator-footer>span{display:flex;align-items:center;gap:6px;font-size:8.5px;color:#a0ada0;line-height:1.5}
.translator-footer>span>svg{color:#a7b79d}
.translate-button{min-height:35px;font-size:10.5px;gap:12px;padding:8px 15px}
.translation-error{font-size:10px;line-height:1.6;color:#b85f57;background:#fdf3f1;border-top:1px solid #f4deda;padding:10px 17px}
.translation-loading .skeleton{height:14px;margin-top:3px;max-width:90%}
.translation-loading .skeleton:nth-child(2){width:58%;margin-top:13px}
.translation-loading>span{display:block;font-size:9px;color:#92a289;margin-top:15px}
.recording{background:#fce8e4!important;color:#c9695e!important;animation:pulse 1s infinite}
.document-name{display:flex;align-items:center;gap:5px;margin-bottom:8px;font-size:8px;color:#8a9b88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.translator-expanded{min-height:420px}
.translator-expanded .translator-heading{padding:21px 24px}
.translator-expanded .translator-heading h2{font-size:15px}
.translator-expanded .translator-languages{padding:9px 16px}
.translator-expanded .language-select{font-size:13px}
.translator-expanded .translation-panels{min-height:240px}
.translator-expanded .translation-source,.translator-expanded .translation-output{padding:25px 25px 46px}
.translator-expanded .translation-source textarea{height:165px;font-size:22px;padding-right:20px}
.translator-expanded .translated-text{font-size:22px;max-height:165px}
.translator-expanded .clear-text{top:24px;right:14px}
.translator-expanded .pronunciation{font-size:10px;margin-top:12px}
.translator-expanded .panel-tools{left:19px;right:21px;bottom:13px}
.translator-expanded .panel-tools .icon-button{width:30px;height:30px}
.translator-expanded .panel-tools>.output-language{font-size:10px}
.translator-expanded .translator-footer{padding:16px 23px}
.translator-expanded .translator-footer>span{font-size:11px}
.translator-expanded .translate-button{font-size:12px;min-height:39px;padding:10px 21px}
.translation-privacy{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;background:#fbfcfb;border-top:1px solid #edf1ec;color:#a1aca0;font-size:9px;text-align:center;line-height:1.6}
.translation-notes{display:grid;grid-template-columns:1fr 1fr;gap:23px;margin-top:24px}
.translation-notes>.card{padding:24px}
.translation-notes h3{font-size:15px;margin-top:15px;font-weight:600;letter-spacing:-.25px}
.translation-notes p{font-size:12px;color:#8b998d;line-height:1.9;margin:9px 0 12px}

/* Language paths and learning */
.course-card{overflow:hidden;min-width:0;transition:box-shadow .2s,border-color .2s}
.course-card:hover{border-color:#cadbcd;box-shadow:0 4px 14px #28442d06}
.course-image{position:relative;display:block;width:100%;height:146px;overflow:hidden;padding:0;text-align:left;background:#e0e9dd}
.course-image>img{height:100%;width:100%;object-fit:cover;transition:transform .6s ease;filter:saturate(.77) brightness(.93)}
.course-image:hover>img{transform:scale(1.045);filter:saturate(.95) brightness(1)}
.course-image:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#17351b26);pointer-events:none}
.course-level{position:absolute;left:12px;top:11px;display:flex;align-items:center;gap:5px;background:#ffffffed;border:1px solid #ffffff66;padding:4px 7px;border-radius:4px;color:#6e856d;font-size:8px;z-index:1;line-height:1.4}
.course-level>span{width:4px;height:4px;background:#83b683;border-radius:50%}
.course-flag{position:absolute;right:11px;top:10px;background:#fffffff0;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:1;border:2px solid #ffffffb3}
.course-content{padding:17px 17px 14px}
.course-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#71ab78}
.course-title-row h3{font-size:17px;line-height:1.3;letter-spacing:-.45px;font-weight:600;color:#3b5141}
.course-region{font-size:10px;color:#9aa697;margin-top:6px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.course-progress-label{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:17px;font-size:9px;color:#a0ad9c}
.course-progress-label>span:last-child:not(:first-child){color:#8bb286;font-size:8px}
.progress-track{height:4px;background:#eef3eb;border-radius:4px;overflow:hidden;margin-top:8px}
.progress-track>span{display:block;height:100%;border-radius:4px;background:#8fcea0;transition:width .4s ease}
.course-continue{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:10.5px;font-weight:500;color:#6a8c68;margin-top:15px;padding:11px 0 1px;border-top:1px solid #eff2ec}
.course-continue:hover{color:#258b49}
.course-compact .course-image{height:111px}
.course-compact .course-level{left:9px;top:9px;font-size:6.5px;padding:3px 5px;gap:4px}
.course-compact .course-level>span{width:3px;height:3px}
.course-compact .course-flag{height:20px;width:20px;right:9px;top:8px;font-size:11px}
.course-compact .course-content{padding:13px 13px 11px}
.course-compact .course-title-row h3{font-size:14px;letter-spacing:-.3px}
.course-compact .course-progress-label{font-size:8px;margin-top:10px}
.course-compact .course-progress-label>span:last-child:not(:first-child){font-size:7px}
.course-compact .progress-track{height:3px;margin-top:7px}
.course-compact .course-continue{font-size:9px;padding:9px 0 0;margin-top:11px}
.course-compact .course-continue>svg{width:13px;height:13px}
.learning-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;background:#edf5ed;border:1px solid #e0ebde;border-radius:13px;padding:32px 36px;margin-bottom:27px;overflow:hidden;position:relative}
.learning-hero h2{font-size:33px;line-height:1.25;letter-spacing:-1.1px;font-weight:600;color:#35523b;margin-top:13px}
.learning-hero p{font-size:12px;line-height:1.9;max-width:360px;color:#90a08a;margin-top:14px}
.hero-feature{display:flex;align-items:center;gap:7px;font-size:9px;color:#8ba383;margin-top:19px}
.learning-illustration{height:228px;position:relative;max-width:360px;width:100%;justify-self:center}
.hello-bubble{position:absolute;min-width:155px;box-shadow:0 5px 14px #28452e09;border-radius:11px;font-size:25px;letter-spacing:-.8px;font-weight:500;line-height:1.2;padding:19px 23px;z-index:2}
.hello-bubble:after{content:"";position:absolute;width:14px;height:14px;bottom:-6px;left:22px;background:inherit;transform:rotate(45deg);border-radius:2px}
.hello-bubble>span{display:block;font-size:9px;letter-spacing:.3px;font-weight:400;margin-top:7px;opacity:.6}
.bubble-one{left:17px;top:7px;background:white;color:#709767;transform:rotate(-7deg)}
.bubble-two{right:2px;top:80px;background:#526b48;color:#ecf4dd;transform:rotate(8deg);min-width:137px;font-size:28px;z-index:3}
.bubble-three{left:5px;bottom:3px;background:#dae9ca;color:#74896a;font-size:20px;transform:rotate(-3deg)}
.bubble-sparkle{position:absolute;right:8px;top:8px;color:#b2cba3;transform:rotate(10deg)}
.bubble-globe{position:absolute;left:148px;bottom:-14px;color:#bacfad;opacity:.6}
.learning-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.learning-toolbar{margin:0 0 24px;padding:0!important;border:0!important}
.resource-tabs{display:flex;align-items:center;gap:19px;flex-wrap:wrap}
.resource-tabs>button{display:flex;align-items:center;gap:7px;padding:10px 0;color:#a0aaa1;font-size:11px;border-bottom:2px solid transparent;font-weight:500}
.resource-tabs>button.active{color:#53815a;border-bottom-color:#84c58c}
.resource-tabs>button>span{display:flex;align-items:center;justify-content:center;background:#e9f2e6;color:#87a07b;font-size:8px;height:16px;min-width:18px;border-radius:4px;padding:0 4px}
.learning-toolbar .search-field{min-width:190px;max-width:245px;height:36px}
.language-note{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 20px;margin-top:17px;border-top:1px solid #e1e9df;color:#97ab91;font-size:10px;line-height:1.7;text-align:center}
.world-course-image{background:radial-gradient(ellipse at 30% 40%,#e4efe0,#eef2e6);display:flex;align-items:center;justify-content:center;position:relative}
.world-course-image:before{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffffb3;border-radius:50%;box-shadow:0 0 0 25px #ffffff38,0 0 0 55px #ffffff30}
.world-flag{font-size:48px;filter:saturate(.75);z-index:1;position:relative}
.streak-pill{display:flex;align-items:center;gap:7px;font-size:11px;color:#bb945f;background:#fff7eb;border:1px solid #f1e6d5;border-radius:6px;padding:9px 12px;white-space:nowrap}
.streak-pill svg{color:#d4a260}
.lesson-modal{max-width:520px!important}
.lesson-intro,.lesson-quiz,.lesson-complete{padding:28px}
.lesson-intro{text-align:center}
.lesson-intro>.eyebrow{font-size:8px;margin-top:7px}
.lesson-word{font-size:34px;letter-spacing:-1px;line-height:1.4;color:#4c7e51;margin:34px 0 8px;font-weight:500;overflow-wrap:anywhere}
.lesson-meaning{font-size:16px;color:#95a18d;margin-bottom:25px}
.lesson-intro>.button.secondary{font-size:11px;color:#83a177;background:#f8fbf4;border-color:#e5edde}
.lesson-tip{display:flex;align-items:center;text-align:left;gap:12px;background:#f5f8ef;border-radius:8px;padding:15px;margin:30px 0 20px;color:#a5b293}
.lesson-tip p{font-size:11px;line-height:1.7;color:#94a387}
.lesson-main-button{width:100%;min-height:43px;justify-content:space-between;margin-top:9px}
.quiz-progress{display:flex;gap:6px;margin-bottom:26px}
.quiz-progress>span{height:4px;border-radius:5px;background:#eef3e9;flex:1}
.quiz-progress>span.active{background:#8ac795}
.lesson-quiz>h3{font-size:19px;line-height:1.6;letter-spacing:-.35px;font-weight:500;margin:12px 0 24px}
.quiz-choices{display:flex;flex-direction:column;gap:11px}
.quiz-choices>button{border:1px solid #e5eae1;border-radius:8px;text-align:left;display:flex;align-items:center;gap:13px;padding:12px 14px;color:#7e8e76;font-size:12px;min-height:49px}
.quiz-choices>button>span:first-child{height:24px;width:24px;border:1px solid #e7ecdf;background:#fafcf8;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:9px;color:#a3ae98;flex-shrink:0}
.quiz-choices>button>span:nth-child(2){flex:1}
.quiz-choices>button:hover:not(:disabled){border-color:#9dc692;background:#f5f9f0}
.quiz-choices>button:disabled{opacity:1}
.quiz-choices>button.correct{background:#eff8ed;border-color:#92c98a;color:#5f9654}
.quiz-choices>button.incorrect{background:#fff4f0;border-color:#dfb4a4;color:#b48773}
.quiz-feedback{font-size:11px;line-height:1.7;margin-top:15px;padding:0 3px}
.quiz-feedback.correct{color:#79a16a}
.quiz-feedback.incorrect{color:#b18b70}
.lesson-quiz>.lesson-main-button{margin-top:23px}
.lesson-complete{text-align:center;padding-top:35px}
.completion-icon{display:flex;align-items:center;justify-content:center;height:81px;width:81px;margin:0 auto 27px;background:#edf7e7;border:1px solid #dfeeda;border-radius:50%;color:#8bb97a;box-shadow:0 0 0 9px #f9fbf5}
.lesson-complete h3{font-size:26px;letter-spacing:-.9px;font-weight:500;margin-top:14px}
.lesson-complete>p{font-size:12px;color:#99a58f;line-height:1.8;max-width:360px;margin:14px auto 22px}
.lesson-complete-stat{padding:18px;background:#f4f8ed;color:#91a681;border-radius:8px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:12px;margin-bottom:23px}

/* Saved words and collections */
.library-summary{display:flex;align-items:center;gap:27px;margin:2px 0 27px}
.library-summary>span{display:flex;align-items:center;gap:8px;color:#96a491;font-size:11px}
.resource-toolbar{padding:19px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.search-field{display:flex;align-items:center;gap:9px;border:1px solid #e4eae1;background:white;border-radius:7px;padding:0 11px;height:38px;min-width:220px;max-width:320px;color:#a3b09c;flex:1}
.search-field:focus-within{border-color:#a8c49a;box-shadow:0 0 0 3px #b8d5ab14}
.search-field>input{border:0;background:none;padding:0;height:100%;font-size:11px;outline:0;width:100%;color:#6f8569;min-width:0}
.search-field>input::placeholder{color:#a9b2a2}
.search-field>button{display:flex;align-items:center;color:#a6b09e;padding:1px}
.resource-filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.resource-filters>select{font-size:10px;padding:8px 9px;border:1px solid #e4eae1;border-radius:6px;background:#fff;color:#8c9b81;max-width:170px;height:37px;outline:0;cursor:pointer}
.resource-filters>select:focus{border-color:#a5c596}
.sort-button{font-size:10px;color:#92a088!important;min-height:37px;padding:8px 10px;gap:8px}
.phrasebook-card{overflow:hidden}
.phrase-table-wrap{width:100%;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#d8e4d1 #f5f8f0}
.phrase-table{width:100%;border-collapse:collapse;table-layout:auto;text-align:left;min-width:650px}
.phrase-table thead{background:#fafcf8}
.phrase-table th{position:relative;font-size:8px;font-weight:500;letter-spacing:.8px;color:#9caa93;padding:14px 17px;border-bottom:1px solid #e9eee4;white-space:nowrap}
.phrase-table td{padding:18px 17px;border-bottom:1px solid #edf1e8;vertical-align:middle;max-width:240px;overflow-wrap:anywhere;position:relative}
.phrase-table tbody tr:hover{background:#fcfefa}
.phrase-table tbody tr:last-child td{border-bottom:0}
.table-source{display:block;font-size:12px;color:#697c61;line-height:1.6}
.table-date{display:block;font-size:8px;color:#adb6a3;margin-top:7px;line-height:1.5;white-space:nowrap}
.table-translation{font-size:12px;color:#6d8d5d;line-height:1.7;display:inline}
.inline-listen{display:inline-flex;padding:0;margin-left:6px;vertical-align:middle;color:#b1c1a7;opacity:.6}
.inline-listen:hover{color:#6c9c58;opacity:1}
.language-badge{display:inline-flex;align-items:center;gap:7px;font-size:10px;color:#91a280;white-space:nowrap}
.language-badge>span{font-size:9px}
.table-collection{font-size:9px;color:#a3ae98;line-height:1.7}
.row-actions{display:flex;align-items:center;gap:1px;justify-content:flex-end}
.row-actions .icon-button{width:24px;height:27px;color:#a8b69d}
.row-actions .icon-button.is-saved{color:#7da56b}
.row-actions .delete-action:hover{background:#fff2ec;color:#c3947e}
.phrase-table .actions-column{padding:0;min-width:90px}
.table-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 19px;background:#fbfdf9;border-top:1px solid #e9eee2;color:#a5b19b;font-size:9px;line-height:1.7}
.table-footer>svg{color:#a7ba9a}
.back-link{display:flex;align-items:center;gap:7px;font-size:10px;color:#91a87f;margin-bottom:17px}
.back-link:hover{color:#619544}
.collection-toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px;color:#98a78c;font-size:11px}
.collection-toolbar .search-field{max-width:265px;min-width:190px}
.collections-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}
.collection-card{overflow:hidden}
.color-green{background:#eaf4e3;color:#8cad73}
.color-blue{background:#e6eff7;color:#8eaac5}
.color-orange{background:#fbefdf;color:#c2a070}
.color-purple{background:#f0eafa;color:#ae99cd}
.color-pink{background:#faeaf0;color:#ce9db1}
.collection-card-top{height:112px;position:relative;padding:23px;display:flex;justify-content:space-between;align-items:flex-start}
.collection-folder{display:flex;padding:3px 0}
.collection-actions{display:flex;align-items:center;gap:2px;opacity:.65}
.collection-actions .icon-button{width:26px;height:26px;color:inherit}
.collection-actions .icon-button:hover{background:#ffffff5c}
.collection-count{position:absolute;right:23px;bottom:18px;border:1px solid #ffffff99;background:#ffffff59;font-size:9px;border-radius:4px;padding:4px 7px;font-weight:500}
.collection-card-content{padding:22px}
.collection-title{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font-size:16px;letter-spacing:-.35px;font-weight:600;line-height:1.4;padding:0;color:#5f7950}
.collection-title>svg{color:#a4b993}
.collection-title:hover{color:#41822b}
.collection-card-content>p{font-size:10.5px;line-height:1.8;color:#9da990;margin-top:9px;min-height:38px}
.collection-preview-list{display:flex;flex-direction:column;gap:12px;margin-top:20px;min-height:70px}
.collection-preview-list>span{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.collection-preview-list>span>span{font-size:10px;color:#95a387;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection-preview-list .collection-empty{font-size:10px;color:#b0baa6;font-style:italic;line-height:1.7}
.collection-card-content>.text-button{border-top:1px solid #edf1e5;display:flex;justify-content:space-between;padding:16px 0 0;width:100%;margin-top:18px;font-size:10px;color:#91a67e}
.new-collection-card{background:#f7faf3;border:1px dashed #d4dfc8;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:300px;gap:10px;padding:25px;color:#a1b38f}

.new-collection-card p{font-size:10px;color:#afbaa4;line-height:1.8}
.new-collection-card:hover{background:#eff6e7;border-color:#a7be92;color:#7b9b60}
.empty-state{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:68px 24px 72px;min-height:300px}
.empty-icon{width:66px;height:66px;background:#f0f6e9;border:1px solid #e6efdc;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#9fba87;margin-bottom:20px}
.empty-state h3{font-size:19px;letter-spacing:-.4px;font-weight:500;color:#718960}
.empty-state p{font-size:12px;color:#a0ae93;line-height:1.9;max-width:350px;margin:11px auto 22px}

/* Profile and preferences */
.settings-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start}
.settings-card{padding:26px}
.settings-card h2{font-size:16px;font-weight:500;letter-spacing:-.35px;color:#637d55}
.settings-card p{font-size:11px;line-height:1.9;color:#9ca98e;margin-top:9px}
.settings-section-heading{display:flex;align-items:center;gap:13px;margin-bottom:24px}

/* Dialogs, forms, and command search */
.modal-backdrop{position:fixed;inset:0;background:#24332b57;backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:25px;animation:fade-in .16s ease}
.modal{width:100%;max-width:490px;max-height:calc(100dvh - 50px);overflow:auto;border:1px solid #e7eddf;border-radius:15px;background:white;box-shadow:0 25px 100px #20322130;outline:0;animation:modal-in .2s ease;scrollbar-width:thin;scrollbar-color:#dbe6d3 white}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:24px 25px 20px;border-bottom:1px solid #edf1e6;display:flex;align-items:flex-start;justify-content:space-between;gap:13px}
.modal-header h2{font-size:20px;font-weight:500;letter-spacing:-.65px;line-height:1.45;color:#5d754f}

.editor-form label>input:focus,.editor-form label>textarea:focus,.editor-form label>select:focus,.password-field>input:focus{border-color:#a9ca94;box-shadow:0 0 0 3px #c0d9af1f}
.editor-form label>input::placeholder,.editor-form label>textarea::placeholder,.password-field>input::placeholder{color:#b1bca5;font-size:11px}
.editor-form label>textarea{resize:vertical;min-height:76px;line-height:1.7}
.editor-form .optional{position:absolute;right:0;top:1px;font-size:9px;color:#b3bea6;font-weight:400}
.form-language-row{display:grid;grid-template-columns:1fr 20px 1fr;align-items:end;gap:12px}

.collection-preview{display:flex;align-items:center;gap:17px;border-radius:8px;padding:19px;font-size:14px;font-weight:500;letter-spacing:-.2px}

.search-modal{max-width:540px}
